<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>IFL — Iberian Football League</title>

    <!-- FAVICON -->
    <link
        rel="icon"
        type="image/png"
        href="images/IFL_Logo.png"
    >

    <!-- CSS -->
    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>


<body>


    <!-- =================================
         LOGIN
    ================================== -->

    <main
        class="login-page"
        id="login-page"
    >


        <!-- LOGO GIGANTE DE FONDO -->

        <img
            class="background-logo"
            src="images/IFL_Logo.png"
            alt=""
            aria-hidden="true"
        >


        <!-- TARJETA DE LOGIN -->

        <div class="login-card">


            <!-- LOGO PRINCIPAL -->

            <div class="ifl-logo">

                <img
                    src="images/IFL_Logo.png"
                    alt="IFL"
                >

            </div>


            <!-- TITULO -->

            <h1>
                Iberian Football League
            </h1>


            <!-- SUBTITULO -->

            <p class="login-subtitle">
                Plataforma oficial de la IFL
            </p>


            <!-- DISCORD -->

            <button
                id="discord-login"
                class="discord-button"
            >
                Iniciar sesión con Discord
            </button>


            <!-- INFORMACION -->

            <p class="login-info">
                Utiliza tu cuenta de Discord para acceder a la plataforma.
            </p>


        </div>

    </main>



    <!-- =================================
         APP
    ================================== -->

    <main
        id="app"
        class="app-page"
        style="display: none;"
    >


        <!-- HEADER -->

        <header class="app-header">

            <div>

                <strong>
                    IFL
                </strong>

                <span>
                    Iberian Football League
                </span>

            </div>


            <button
                id="logout-button"
                class="logout-button"
            >
                Cerrar sesión
            </button>

        </header>


        <!-- DASHBOARD -->

        <section class="dashboard">

            <h2>
                Bienvenido a la IFL
            </h2>

            <p id="user-info">
                Cargando usuario...
            </p>

        </section>


    </main>



    <!-- =================================
         SUPABASE
    ================================== -->

    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    ></script>


    <!-- =================================
         IFL JAVASCRIPT
    ================================== -->

    <script src="js/app.js"></script>


</body>

</html>
